version: '3.9'

services:
  backend:
    build: ./backend
    container_name: anishtayin-backend
    restart: always
    volumes:
      - backend-data:/app
    networks:
      - internal

  frontend:
    build: ./frontend
    container_name: anishtayin-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - internal

  agent:
    build: ./agent
    container_name: anishtayin-agent
    restart: always
    network_mode: host
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: anishtayin-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  backend-data:
