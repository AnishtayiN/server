version: '3.8'

services:
  xpanel:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: xpanel
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - xpanel_data:/app/data
      - xpanel_config:/app/config
      - xpanel_logs:/app/logs
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_TYPE=postgresql
      - POSTGRES_HOST=db
      - POSTGRES_USER=${POSTGRES_USER:-xpanel}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-xpanel}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-admin123}
    networks:
      - xpanel_network
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: xpanel-db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-xpanel}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-xpanel}
    networks:
      - xpanel_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xpanel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  xray:
    image: ghcr.io/xtls/xray-core:latest
    container_name: xray
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - xpanel_config:/etc/xray
    environment:
      - XRAY_VMESS_AEAD_FORCED=false
    depends_on:
      - xpanel

volumes:
  xpanel_data:
  xpanel_config:
  xpanel_logs:
  postgres_data:

networks:
  xpanel_network:
    driver: bridge
